<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8" />
  <title>NeonStrike FPS</title>
  <style>
    body {
      margin: 0;
      overflow: hidden;
      background: #05060a;
      color: #0ff;
      font-family: system-ui, sans-serif;
    }
    #hud {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      font-size: 14px;
      text-shadow: 0 0 6px #0ff;
    }
    #hud span {
      margin-right: 12px;
    }
    #hint {
      position: fixed;
      bottom: 10px;
      left: 50%;
      transform: translateX(-50%);
      font-size: 14px;
      color: #ccc;
      text-shadow: 0 0 4px #000;
    }
    canvas {
      display: block;
    }
    #centerDot {
      position: fixed;
      top: 50%;
      left: 50%;
      width: 6px;
      height: 6px;
      margin-left: -3px;
      margin-top: -3px;
      border-radius: 50%;
      background: #0ff;
      box-shadow: 0 0 8px #0ff;
      pointer-events: none;
      z-index: 9;
    }
  </style>
</head>
<body>
  <div id="hud">
    <span id="health">HP: 100</span>
    <span id="score">Score: 0</span>
    <span id="ammo">Ammo: ∞</span>
  </div>
  <div id="hint">Click to lock mouse • WASD to move • Left‑click to shoot</div>
  <div id="centerDot"></div>
  <canvas id="game"></canvas>

  <script>
    const canvas = document.getElementById("game");
    const ctx = canvas.getContext("2d");
    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    // ===== INPUT =====
    const keys = {};
    window.addEventListener("keydown", e => keys[e.code] = true);
    window.addEventListener("keyup", e => keys[e.code] = false);

    let pointerLocked = false;
    let yaw = 0;
    let pitch = 0;

    canvas.addEventListener("click", () => {
      canvas.requestPointerLock();
    });

    document.addEventListener("pointerlockchange", () => {
      pointerLocked = (document.pointerLockElement === canvas);
      document.getElementById("hint").style.opacity = pointerLocked ? "0.3" : "1";
    });

    document.addEventListener("mousemove", e => {
      if (!pointerLocked) return;
      const sensitivity = 0.0025;
      yaw += e.movementX * sensitivity;
      pitch -= e.movementY * sensitivity;
      const maxPitch = Math.PI / 2 - 0.2;
      if (pitch > maxPitch) pitch = maxPitch;
      if (pitch < -maxPitch) pitch = -maxPitch;
    });

    // ===== PLAYER =====
    const player = {
      x: 0,
      z: 0,
      y: 1.7,
      speed: 8,
      health: 100
    };

    // ===== ENEMIES (fake "multiplayer" bots) =====
    const enemies = [];
    const arenaSize = 40;
    function spawnEnemy() {
      enemies.push({
        x: (Math.random() - 0.5) * arenaSize,
        z: (Math.random() - 0.5) * arenaSize,
        radius: 0.6,
        alive: true,
        color: "#f0f",
        wanderAngle: Math.random() * Math.PI * 2
      });
    }
    for (let i = 0; i < 8; i++) spawnEnemy();

    let score = 0;

    // ===== SHOOTING =====
    window.addEventListener("mousedown", e => {
      if (e.button !== 0) return;
      shoot();
    });

    function shoot() {
      // Ray from player forward
      const dir = {
        x: Math.sin(yaw) * Math.cos(pitch),
        z: Math.cos(yaw) * Math.cos(pitch)
      };
      const maxDist = 50;

      let hitEnemy = null;
      let hitDist = maxDist;

      enemies.forEach(en => {
        if (!en.alive) return;
        // project enemy center onto ray
        const ex = en.x - player.x;
        const ez = en.z - player.z;
        const t = ex * dir.x + ez * dir.z;
        if (t < 0 || t > maxDist) return;
        const closestX = dir.x * t;
        const closestZ = dir.z * t;
        const dx = ex - closestX;
        const dz = ez - closestZ;
        const d2 = dx * dx + dz * dz;
        if (d2 <= en.radius * en.radius && t < hitDist) {
          hitDist = t;
          hitEnemy = en;
        }
      });

      if (hitEnemy) {
        hitEnemy.alive = false;
        score += 10;
        document.getElementById("score").textContent = "Score: " + score;
        setTimeout(spawnEnemy, 1000);
      }
    }

    // ===== GAME LOOP =====
    let last = performance.now();
    function loop(t) {
      const dt = (t - last) / 1000;
      last = t;

      update(dt);
      draw();

      requestAnimationFrame(loop);
    }
    requestAnimationFrame(loop);

    function update(dt) {
      // movement
      const forward = {
        x: Math.sin(yaw),
        z: Math.cos(yaw)
      };
      const right = {
        x: Math.sin(yaw + Math.PI / 2),
        z: Math.cos(yaw + Math.PI / 2)
      };

      let mx = 0, mz = 0;
      if (keys["KeyW"]) { mx += forward.x; mz += forward.z; }
      if (keys["KeyS"]) { mx -= forward.x; mz -= forward.z; }
      if (keys["KeyA"]) { mx -= right.x; mz -= right.z; }
      if (keys["KeyD"]) { mx += right.x; mz += right.z; }

      const len = Math.hypot(mx, mz);
      if (len > 0) {
        mx /= len;
        mz /= len;
        player.x += mx * player.speed * dt;
        player.z += mz * player.speed * dt;
        // clamp to arena
        player.x = Math.max(-arenaSize / 2, Math.min(arenaSize / 2, player.x));
        player.z = Math.max(-arenaSize / 2, Math.min(arenaSize / 2, player.z));
      }

      // enemies wander + "attack"
      enemies.forEach(en => {
        if (!en.alive) return;
        en.wanderAngle += (Math.random() - 0.5) * 0.5;
        const speed = 2.5;
        en.x += Math.cos(en.wanderAngle) * speed * dt;
        en.z += Math.sin(en.wanderAngle) * speed * dt;

        // keep in arena
        en.x = Math.max(-arenaSize / 2, Math.min(arenaSize / 2, en.x));
        en.z = Math.max(-arenaSize / 2, Math.min(arenaSize / 2, en.z));

        const dx = en.x - player.x;
        const dz = en.z - player.z;
        const dist = Math.hypot(dx, dz);
        if (dist < 1.5) {
          player.health -= 10 * dt;
          if (player.health < 0) player.health = 0;
          document.getElementById("health").textContent =
            "HP: " + Math.round(player.health);
        }
      });
    }

    function draw() {
      const w = canvas.width;
      const h = canvas.height;

      // sky + floor
      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, "#02030a");
      grad.addColorStop(0.5, "#05060a");
      grad.addColorStop(1, "#050808");
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      // simple horizon
      ctx.strokeStyle = "#0ff";
      ctx.globalAlpha = 0.2;
      ctx.beginPath();
      ctx.moveTo(0, h / 2);
      ctx.lineTo(w, h / 2);
      ctx.stroke();
      ctx.globalAlpha = 1;

      // draw enemies as "3D" billboards
      enemies.forEach(en => {
        if (!en.alive) return;

        const dx = en.x - player.x;
        const dz = en.z - player.z;

        // transform to camera space
        const sinY = Math.sin(yaw);
        const cosY = Math.cos(yaw);
        const camX = dx * cosY - dz * sinY;
        const camZ = dx * sinY + dz * cosY;

        if (camZ <= 0.1) return; // behind player

        const dist = Math.hypot(camX, camZ);
        const size = Math.max(10, 120 / dist);

        const screenX = w / 2 + (camX / camZ) * (w * 0.4);
        const screenY = h / 2;

        ctx.fillStyle = en.color;
        ctx.beginPath();
        ctx.arc(screenX, screenY, size / 2, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#000";
        ctx.lineWidth = 2;
        ctx.stroke();
      });

      // vignette
      const vg = ctx.createRadialGradient(
        w / 2, h / 2, 0,
        w / 2, h / 2, Math.max(w, h) / 1.2
      );
      vg.addColorStop(0, "rgba(0,0,0,0)");
      vg.addColorStop(1, "rgba(0,0,0,0.7)");
      ctx.fillStyle = vg;
      ctx.fillRect(0, 0, w, h);
    }
  </script>
</body>
</html>
